[package]
name = "obsidian-vault-mcp"
version = "0.4.0"
edition = "2024"
description = "An MCP server for Obsidian vaults that lets AI assistants safely search, read, and edit Markdown notes while understanding their links, tags, categories, and structure."
repository = "https://github.com/ptdgrp/obsidian-vault-mcp"
license = "MIT"
categories = ["command-line-utilities", "text-processing", "filesystem"]
keywords = [
  "mcp",
  "obsidian",
  "markdown",
  "wikilink"
]
readme = "./README.md"
include = [
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
]

[features]
default = []
# Enables PDF and DOCX attachment reading and the read_attachment MCP tool.
attachments = ["dep:pdf-inspector", "dep:quick-xml", "dep:zip"]
# Adds local PP-OCRv6 inference for scanned PDFs and image attachments. The
# runtime libraries and verified model files remain external to the binary.
ocr-local = ["attachments", "pdf-inspector/ocr", "dep:image"]

[dependencies]
aho-corasick = "1.1.4"
anyhow = "1.0.102"
camino = { version = "1.2.2", features = ["serde1"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
globset = "0.4.18"
ignore = "0.4.26"
ptdgrp-markdown = "1.1.4"
memchr = "2.8.1"
natord = "1.0.9"
rayon = "1.11.0"
regex = "1.12.3"
rmcp = { version = "3.1.0", features = ["server", "macros", "schemars", "transport-io"] }
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tempfile = "3"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "io-std", "fs"]}
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"
walkdir = "2.5.0"
arc-swap = "1.9.2"
pdf-inspector = { version = "=1.17.0", optional = true }
quick-xml = { version = "0.42.0", optional = true }
zip = { version = "6.0.0", default-features = false, features = ["deflate"], optional = true }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"], optional = true }

[dev-dependencies]
insta = "1"
pretty_assertions = "1"


[profile.release]
strip = true
lto = true
opt-level = 3
panic = "abort"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
