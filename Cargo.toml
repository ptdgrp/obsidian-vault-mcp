[package]
name = "obsidian-vault-mcp"
version = "0.3.5"
edition = "2024"

[dependencies]
aho-corasick = "1.1.4"
anyhow = "1.0.102"
camino = { version = "1.2.2", features = ["serde1"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
globset = "0.4.18"
fs2 = "0.4.3"
ignore = "0.4.26"
ptdgrp-markdown = "1.1.0"
memchr = "2.8.1"
natord = "1.0.9"
rayon = "1.11.0"
regex = "1.12.3"
rmcp = { version = "2.2.0", features = ["server", "macros", "schemars", "transport-io"] }
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tempfile = "3"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "io-std", "fs"]}
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"
walkdir = "2.5.0"
arc-swap = "1.9.2"

[dev-dependencies]
insta = "1"
pretty_assertions = "1"


[profile.release]
strip = true
lto = true
opt-level = 3
panic = "abort"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
